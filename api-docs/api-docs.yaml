components:
  schemas:
    UserRequestDto:
      type: object
      properties:
        userName:
          type: string
          maxLength: 100
          minLength: 0
        lastName:
          type: string
          maxLength: 100
          minLength: 0
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 4
      required:
      - email
      - lastName
      - password
      - userName
    CourseBasicDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        price:
          type: integer
          format: int32
    UserResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userName:
          type: string
        lastName:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
        purchasedCourses:
          type: array
          items:
            $ref: "#/components/schemas/CourseBasicDto"
    CourseRequestDto:
      type: object
      properties:
        courseName:
          type: string
          maxLength: 100
          minLength: 0
        teacher:
          type: string
          maxLength: 100
          minLength: 0
        price:
          type: integer
          format: int32
          minimum: 0
        description:
          type: string
          maxLength: 2000
          minLength: 0
        students:
          type: integer
          format: int32
          minimum: 0
        imageIds:
          type: array
          items:
            type: integer
            format: int64
      required:
      - courseName
      - description
      - price
      - students
      - teacher
    CourseResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        courseName:
          type: string
        teacher:
          type: string
        price:
          type: integer
          format: int32
        description:
          type: string
        students:
          type: array
          items:
            $ref: "#/components/schemas/UserBasicDto"
        imageIds:
          type: array
          items:
            type: integer
            format: int64
    UserBasicDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userName:
          type: string
        email:
          type: string
    CommentRequestDto:
      type: object
      properties:
        description:
          type: string
          maxLength: 500
          minLength: 0
        user:
          type: string
        courseId:
          type: integer
          format: int64
      required:
      - courseId
      - description
    CommentResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        description:
          type: string
        user:
          type: string
        publicationDate:
          type: string
        courseId:
          type: integer
          format: int64
        courseName:
          type: string
    AuthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - SUCCESS
          - FAILURE
        message:
          type: string
        error:
          type: string
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    CartResponseDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        product:
          type: string
        price:
          type: integer
          format: int32
        userName:
          type: string
        courses:
          type: array
          items:
            $ref: "#/components/schemas/CourseResponseDto"
    Pageable:
      type: object
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        size:
          type: integer
          format: int32
          minimum: 1
        sort:
          type: array
          items:
            type: string
    PageUserResponseDto:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/UserResponseDto"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        unpaged:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    PageCourseResponseDto:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/CourseResponseDto"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        empty:
          type: boolean
    PageCommentResponseDto:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/CommentResponseDto"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        empty:
          type: boolean
    PageCartResponseDto:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/CartResponseDto"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        empty:
          type: boolean
  securitySchemes:
    bearerAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT
