spring.application.name=AcademiaElSoto
spring.mustache.suffix=.html

# If DB_URL environment variable is missing, use localhost as fallback
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/academia_elsoto?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

# If DB_USER environment variable is missing, use root
spring.datasource.username=${DB_USER:root}

# If DB_PASS environment variable is missing, the app will fail to start (Perfect for security!)
spring.datasource.password=${DB_PASS:MIM_DATABASE}

spring.jpa.hibernate.ddl-auto=update

# --- SECURITY MISCONFIGURATION PROTECTIONS ---
# 1. Hide SQL queries from logs
spring.jpa.show-sql=false

# 2. Hide error trace and internal messages from the client (Modern Spring Boot)
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

server.port=8443
server.ssl.key-store=classpath:keystore.jks
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=selfsigned

# Hidden certificate password
server.ssl.key-store-password=${SSL_PASSWORD:password}

# --- CRYPTOGRAPHIC FAILURES PROTECTION ---
# Force modern and secure TLS versions only, disabling vulnerable ones (TLSv1.0, TLSv1.1)
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3

# Upload files up to 10 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# DEBUG level commented out to prevent exposing security information
#logging.level.org.springframework.security=DEBUG

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/v1/**

# Default users passwords (uses 'pass' and 'adminpass' for local testing if not set)
default.user.password=${USER_PASSWORD:pass}
default.admin.password=${ADMIN_PASSWORD:adminpass}

spring.session.timeout=30m
server.servlet.session.timeout=30m

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# Save logs in academia.log
logging.file.name=academia.log
logging.level.es.codeurjc.AcademiaElSoto=INFO

bucket4j.methods.llm_chat.rate-limit.bandwidth.capacity=3
bucket4j.methods.llm_chat.rate-limit.bandwidth.time=1
bucket4j.methods.llm_chat.rate-limit.bandwidth.unit=minutes

app.llm.connect-timeout=5000
app.llm.read-timeout=30000

app.llm.max-input-length=1000

spring.main.banner-mode=off