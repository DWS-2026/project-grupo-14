spring.application.name=AcademiaElSoto
spring.mustache.suffix=.html

# If DB_URL environment variable is missing, use localhost as fallback
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/academia_elsoto?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

# If DB_USER environment variable is missing, use root
spring.datasource.username=${DB_USER:root}

# If DB_PASS environment variable is missing, the app will fail to start (Perfect for security!)
spring.datasource.password=${DB_PASS}

spring.jpa.hibernate.ddl-auto=update

# --- SECURITY MISCONFIGURATION PROTECTIONS ---
# 1. Hide SQL queries from logs
spring.jpa.show-sql=false

# 2. Hide error trace and internal messages from the client (Modern Spring Boot)
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

server.port=8443
server.ssl.key-store=classpath:keystore.jks
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=selfsigned

# Hidden certificate password
server.ssl.key-store-password=${SSL_PASSWORD}

# Upload files up to 10 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# DEBUG level commented out to prevent exposing security information
#logging.level.org.springframework.security=DEBUG

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/v1/**

# Default users passwords (uses 'pass' and 'adminpass' for local testing if not set)
default.user.password=${USER_PASSWORD:pass}
default.admin.password=${ADMIN_PASSWORD:adminpass}